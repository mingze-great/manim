<svg width="1440" height="980" viewBox="0 0 1440 980" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1440" height="980" fill="#F4F7FA"/>
<rect x="80" y="60" width="1280" height="180" rx="28" fill="url(#g2)"/>
<text x="140" y="140" fill="#FFFFFF" font-family="Arial" font-size="42" font-weight="700">讲解型视频创作台</text>
<text x="140" y="188" fill="#EAF6FF" font-family="Arial" font-size="24">输入文案，选择钩子、视觉方向、分镜数量和音色</text>
<rect x="80" y="290" width="1280" height="580" rx="28" fill="#FFFDF8" stroke="#F0DDC8"/>
<rect x="120" y="340" width="700" height="470" rx="22" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="150" y="390" fill="#17394F" font-family="Arial" font-size="28" font-weight="700">主题或原始文案</text>
<rect x="150" y="420" width="640" height="340" rx="18" fill="#F8FAFC" stroke="#D8E4EC"/>
<text x="176" y="474" fill="#6B7280" font-family="Arial" font-size="22">把完整文案直接粘进来，或输入一句主题。</text>
<text x="176" y="516" fill="#6B7280" font-family="Arial" font-size="22">系统会自动拆成 3-10 幕，并根据文案控制时长。</text>
<rect x="860" y="340" width="440" height="470" rx="22" fill="#FFF7EF" stroke="#F3D7B9"/>
<text x="900" y="394" fill="#17394F" font-family="Arial" font-size="26" font-weight="700">右侧设置区</text>
<text x="900" y="450" fill="#7B6856" font-family="Arial" font-size="22">1. 开头钩子</text>
<text x="900" y="494" fill="#7B6856" font-family="Arial" font-size="22">2. 视觉方向</text>
<text x="900" y="538" fill="#7B6856" font-family="Arial" font-size="22">3. 分镜数量（3-10）</text>
<text x="900" y="582" fill="#7B6856" font-family="Arial" font-size="22">4. AI 音色与语速</text>
<text x="900" y="626" fill="#7B6856" font-family="Arial" font-size="22">5. 工作流：分步或一键</text>
<rect x="900" y="700" width="320" height="58" rx="18" fill="#1C5A6B"/>
<text x="954" y="737" fill="#FFFFFF" font-family="Arial" font-size="24" font-weight="700">开始制作讲解型视频</text>
<defs>
<linearGradient id="g2" x1="80" y1="60" x2="1360" y2="240" gradientUnits="userSpaceOnUse">
<stop stop-color="#153A52"/>
<stop offset="0.65" stop-color="#1D5D70"/>
<stop offset="1" stop-color="#EF9542"/>
</linearGradient>
</defs>
</svg>
