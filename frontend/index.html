<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>思维可视化平台</title>
    <script>
      window.onerror = function(msg, src, line, col, error) {
        console.error('Global error:', msg, src, line, col, error);
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled rejection:', e.reason);
      });

      if (window.location.pathname === '/logout-bridge') {
        try {
          localStorage.removeItem('auth-storage');
          sessionStorage.removeItem('admin_mode');
        } catch (e) {
          console.error('Legacy logout bridge failed', e);
        }
        window.__LOGOUT_BRIDGE__ = true;
      }

      try {
        const raw = localStorage.getItem('auth-storage');
        if (!window.__LOGOUT_BRIDGE__ && raw && !window.location.pathname.startsWith('/v2')) {
          const parsed = JSON.parse(raw);
          const state = parsed && parsed.state ? parsed.state : null;
          const token = state && state.token;
          const user = state && state.user;
          if (token && user && (user.is_admin || user.frontend_version === 'v2')) {
            const originV2 = `${window.location.protocol}//${window.location.hostname}:3002`;
            const target = user.is_admin ? `${originV2}/admin` : originV2;
            if (window.location.pathname !== target) {
              window.location.replace(target);
            }
          }
        }
      } catch (e) {
        console.error('Pre-route redirect check failed', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      if (!window.__LOGOUT_BRIDGE__) {
        import('/src/main.tsx')
      }
    </script>
  </body>
</html>
