<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>思维可视化平台</title>
    <script>
      window.onerror = function(msg, src, line, col, error) {
        console.error('Global error:', msg, src, line, col, error);
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled rejection:', e.reason);
      });

      try {
        const raw = localStorage.getItem('auth-storage');
        if (raw && !window.location.pathname.startsWith('/v2')) {
          const parsed = JSON.parse(raw);
          const state = parsed && parsed.state ? parsed.state : null;
          const token = state && state.token;
          const user = state && state.user;
          if (token && user && (user.is_admin || user.frontend_version === 'v2')) {
            const target = user.is_admin ? '/v2/admin' : '/v2';
            if (window.location.pathname !== target) {
              window.location.replace(target);
            }
          }
        }
      } catch (e) {
        console.error('Pre-route redirect check failed', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
