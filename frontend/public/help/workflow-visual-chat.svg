<svg width="1440" height="920" viewBox="0 0 1440 920" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1440" height="920" fill="#F4F7FB"/>
<rect x="80" y="60" width="1280" height="150" rx="28" fill="url(#g1)"/>
<text x="140" y="140" fill="#FFFFFF" font-family="Arial" font-size="42" font-weight="700">思维可视化对话页</text>
<text x="140" y="186" fill="#EAF6FF" font-family="Arial" font-size="24">先对话打磨内容，再进入任务页生成脚本与视频</text>
<rect x="80" y="250" width="1240" height="580" rx="24" fill="#FFFFFF" stroke="#D8E4EC"/>
<rect x="120" y="300" width="820" height="480" rx="20" fill="#F8FAFC" stroke="#D8E4EC"/>
<rect x="160" y="340" width="560" height="92" rx="18" fill="#E8F1FF"/>
<rect x="340" y="458" width="520" height="92" rx="18" fill="#FFF5E8"/>
<rect x="160" y="576" width="610" height="92" rx="18" fill="#E8F1FF"/>
<text x="188" y="394" fill="#17394F" font-family="Arial" font-size="22">用户：我想做一期关于拖延心理的知识拆解视频</text>
<text x="372" y="512" fill="#8A4B16" font-family="Arial" font-size="22">AI：可以，我先帮你把主题拆成 3 个关键矛盾</text>
<text x="188" y="630" fill="#17394F" font-family="Arial" font-size="22">用户：希望语气更强一点，适合短视频传播</text>
