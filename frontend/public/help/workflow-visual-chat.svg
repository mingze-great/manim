<text x="1020" y="356" fill="#17394F" font-family="Arial" font-size="28" font-weight="700">对话风格</text>
<text x="1020" y="406" fill="#7B6856" font-family="Arial" font-size="22">保守型 / 观点型 / 口语型</text>
<text x="1020" y="450" fill="#7B6856" font-family="Arial" font-size="22">会影响提问方式与表达方式</text>
<rect x="1020" y="488" width="180" height="48" rx="14" fill="#1C5A6B"/>
<text x="1060" y="520" fill="#FFFFFF" font-family="Arial" font-size="22" font-weight="700">发送消息</text>
<rect x="980" y="570" width="300" height="210" rx="20" fill="#F8FAFC" stroke="#D8E4EC"/>
