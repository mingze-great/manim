<text x="1020" y="716" fill="#667985" font-family="Arial" font-size="22">生成脚本</text>
<text x="1020" y="756" fill="#667985" font-family="Arial" font-size="22">渲染视频</text>
<defs>
<linearGradient id="g1" x1="80" y1="60" x2="1360" y2="210" gradientUnits="userSpaceOnUse">
<stop stop-color="#123555"/>
